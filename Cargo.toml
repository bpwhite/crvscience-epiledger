[workspace]
resolver = "2"
members = [
    "crates/epi-core",
    "crates/epi-store",
    "crates/epi-ingest",
    "crates/epi-analytics",
    "crates/epi-app",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Bryan P. White <crvscience.com>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
csv = "1.3"
sha2 = "0.10"
flate2 = "1.1"
eframe = { version = "0.28", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.28"
egui_plot = "0.28"
rfd = "0.14"
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
